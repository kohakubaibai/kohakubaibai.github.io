<style>
@-webkit-keyframes shake {
	0% {
		-webkit-transform-origin: center;
		transform-origin: center;
		-webkit-transform: rotate(-3deg);
		transform: rotate(-3deg)
	}

	50% {
		-webkit-transform-origin: center;
		transform-origin: center;
		-webkit-transform: rotate(3deg);
		transform: rotate(3deg)
	}

	100% {
		-webkit-transform-origin: center;
		transform-origin: center;
		-webkit-transform: rotate(-3deg);
		transform: rotate(-3deg)
	}
}
@keyframes shake {
	0% {
		-webkit-transform-origin: center;
		transform-origin: center;
		-webkit-transform: rotate(-3deg);
		transform: rotate(-3deg)
	}

	50% {
		-webkit-transform-origin: center;
		transform-origin: center;
		-webkit-transform: rotate(3deg);
		transform: rotate(3deg)
	}

	100% {
		-webkit-transform-origin: center;
		transform-origin: center;
		-webkit-transform: rotate(-3deg);
		transform: rotate(-3deg)
	}
}
#qa-q {
    animation: shake 1.2s step-end infinite alternate;
}
#qa-a {
    animation: shake 0.8s step-end infinite alternate;
}
</style>
