<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱氣球飄動</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #f0f0f0, #ffffff);
            min-height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100dvh;
        }

        .main {
            display: flex;
            width: 100dvw;
            height: 100dvh;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .text {
            background-color: #FFFFFF;
            padding: 20px 40px;
            width: 500px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.05);
        }

        .squareWrapper {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100vh;
            z-index: 5;
        }

        .square {
            position: absolute;
            width: 40px;
            height: 40px;
            bottom: -50px;
        }

        .square:nth-child(1) {
            background-color: #d3d3d3;
            left: 5%;
            animation: float1 15s infinite ease-in-out;
        }

        .square:nth-child(2) {
            background-color: #b85450;
            left: 15%;
            animation: float2 18s infinite ease-in-out;
            animation-delay: 2s;
        }

        .square:nth-child(3) {
            background-color: #3d6e5e;
            left: 28%;
            animation: float3 16s infinite ease-in-out;
            animation-delay: 4s;
        }

        .square:nth-child(4) {
            background-color: #8b9456;
            left: 40%;
            animation: float4 17s infinite ease-in-out;
            animation-delay: 1s;
        }

        .square:nth-child(5) {
            background-color: #6b7db8;
            left: 52%;
            animation: float5 19s infinite ease-in-out;
            animation-delay: 3s;
        }

        .square:nth-child(6) {
            background-color: #d4a555;
            left: 65%;
            animation: float6 16.5s infinite ease-in-out;
            animation-delay: 5s;
        }

        .square:nth-child(7) {
            background-color: #d946a6;
            left: 77%;
            animation: float7 18.5s infinite ease-in-out;
            animation-delay: 2.5s;
        }

        .square:nth-child(8) {
            background-color: #20b5b8;
            left: 90%;
            animation: float8 17.5s infinite ease-in-out;
            animation-delay: 4.5s;
        }

        @keyframes float1 {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            25% {
                transform: translateY(-25vh) translateX(12px);
            }
            50% {
                transform: translateY(-50vh) translateX(-8px);
            }
            75% {
                transform: translateY(-75vh) translateX(15px);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(0);
                opacity: 0;
            }
        }

        @keyframes float2 {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            25% {
                transform: translateY(-25vh) translateX(-10px);
            }
            50% {
                transform: translateY(-50vh) translateX(14px);
            }
            75% {
                transform: translateY(-75vh) translateX(-12px);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(8px);
                opacity: 0;
            }
        }

        @keyframes float3 {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            25% {
                transform: translateY(-25vh) translateX(16px);
            }
            50% {
                transform: translateY(-50vh) translateX(-10px);
            }
            75% {
                transform: translateY(-75vh) translateX(18px);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(-6px);
                opacity: 0;
            }
        }

        @keyframes float4 {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            25% {
                transform: translateY(-25vh) translateX(-14px);
            }
            50% {
                transform: translateY(-50vh) translateX(10px);
            }
            75% {
                transform: translateY(-75vh) translateX(-8px);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(12px);
                opacity: 0;
            }
        }

        @keyframes float5 {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            25% {
                transform: translateY(-25vh) translateX(18px);
            }
            50% {
                transform: translateY(-50vh) translateX(-12px);
            }
            75% {
                transform: translateY(-75vh) translateX(14px);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(-10px);
                opacity: 0;
            }
        }

        @keyframes float6 {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            25% {
                transform: translateY(-25vh) translateX(-16px);
            }
            50% {
                transform: translateY(-50vh) translateX(10px);
            }
            75% {
                transform: translateY(-75vh) translateX(-14px);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(12px);
                opacity: 0;
            }
        }

        @keyframes float7 {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            25% {
                transform: translateY(-25vh) translateX(15px);
            }
            50% {
                transform: translateY(-50vh) translateX(-10px);
            }
            75% {
                transform: translateY(-75vh) translateX(18px);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(-8px);
                opacity: 0;
            }
        }

        @keyframes float8 {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            25% {
                transform: translateY(-25vh) translateX(-18px);
            }
            50% {
                transform: translateY(-50vh) translateX(12px);
            }
            75% {
                transform: translateY(-75vh) translateX(-10px);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) translateX(14px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="squareWrapper">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>
        <main class="main">
            <div class="wrapper">
                <div class="text">
                    <h1>大標</h1>
                    <p>文字</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
